        const color = status === 'ok' ? 'var(--green-color)' : ['low','estimated_depleted'].includes(status) ? 'var(--red-color)' : ['refill_soon','needs_weighing','needs_calibration'].includes(status) ? 'var(--amber-color)' : 'var(--secondary-text-color)';
        const scent = read('sensor.replace_me_installed_scent');
